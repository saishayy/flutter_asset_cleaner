name: flutter_asset_cleaner
description: A CLI tool to detect and remove unused assets in Flutter projects
version: 1.0.0
homepage: https://github.com/AyeshaIftikhar/flutter_asset_cleaner


environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  args: ^2.4.2
  path: ^1.8.3
  yaml: ^3.1.2
  glob: ^2.1.2
  colorize: ^3.0.0

dev_dependencies:
  test: ^1.21.0
  lints: ^2.1.1

executables:
  flutter_asset_cleaner: flutter_asset_cleaner